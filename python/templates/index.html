<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NetRecon — Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { background: #0f1724; color: #e6eef8; }
        .card { background: rgba(255,255,255,0.03); border: 0; }
        .muted { color: #9fb2d4; }
        .severity-low { color: #10b981; }
        .severity-medium { color: #f59e0b; }
        .severity-high { color: #ef4444; }
        .search-input { background: rgba(255,255,255,0.05); color: white; border: none; }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">
        <i class="fa-solid fa-shield-halved"></i> NetRecon Dashboard
    </span>
    <button class="btn btn-sm btn-outline-light" onclick="location.reload()">Refresh</button>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <!-- LEFT PANEL -->
        <div class="col-lg-3 mb-4">
            <div class="card p-3">
                <h5>Overview</h5>

                <div class="mt-3">
                    <h3>{{ ports|length }}</h3>
                    <div class="muted">Open Ports</div>
                </div>

                <div class="mt-3">
                    <h4>{{ alerts }}</h4>
                    <div class="muted">Alerts</div>
                </div>

                <hr>

                <a href="/scan" class="btn btn-sm btn-outline-light mt-2">Run Scan</a>
            </div>
        </div>

        <!-- MAIN TABLE -->
        <div class="col-lg-9">
            <div class="card p-3">

                <div class="d-flex justify-content-between mb-3">
                    <h4>Detected Ports</h4>
                    <input id="search" class="form-control w-50 search-input" placeholder="Search...">
                </div>

                <div class="table-responsive">
                    <table class="table text-light">
                        <thead>
                            <tr>
                                <th>Host</th>
                                <th>Port</th>
                                <th>Service</th>
                                <th>Severity</th>
                            </tr>
                        </thead>
                        <tbody>

                        {% for port in ports %}
                            <tr class="port-row"
                                data-search="{{ port.host }} {{ port.port }} {{ port.service }} {{ port.severity }}">

                                <td>{{ port.host }}</td>
                                <td>{{ port.port }}</td>
                                <td>{{ port.service }}</td>

                                <td>
                                    <span class="
                                        {% if port.severity == 'high' %}severity-high
                                        {% elif port.severity == 'medium' %}severity-medium
                                        {% else %}severity-low{% endif %}
                                    ">
                                        {{ port.severity }}
                                    </span>
                                </td>

                            </tr>
                        {% endfor %}

                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
const search = document.getElementById("search");

search.addEventListener("input", function() {
    const value = this.value.toLowerCase();

    document.querySelectorAll(".port-row").forEach(row => {
        const text = row.getAttribute("data-search").toLowerCase();
        row.style.display = text.includes(value) ? "" : "none";
    });
});
</script>

</body>
</html>
